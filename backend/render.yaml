services:
  - type: web
    name: arwa-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: arwa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: arwa-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: arwa-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: arwa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: arwa-db
          property: password

databases:
  - name: arwa-db
    databaseName: arwa
    user: arwa_user
    plan: free
