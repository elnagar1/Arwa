services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arwa_backend
    ports:
      - "8888:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=arwa_db
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: arwa_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      # Prevents overwriting the container's node_modules with the host's (which might be empty or incompatible)
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: arwa_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=arwa_db
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
