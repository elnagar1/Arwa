version: '3.8'

services:
  backend:
    image: php:8.4-cli
    container_name: arwa_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      bash -c "apt-get update && apt-get install -y libzip-dev zip unzip git default-mysql-client
      && docker-php-ext-install pdo_mysql zip
      && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      && composer install
      && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8888:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=arwa_db
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      - db

  frontend:
    image: node:20
    container_name: arwa_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: bash -c "npm install && npm start -- --host 0.0.0.0 --poll 2000"
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: mysql:8.0
    container_name: arwa_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=arwa_db
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
